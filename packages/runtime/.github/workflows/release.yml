name: Release archive

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package and source archive
        run: |
          test "$(git describe --tags --exact-match)" = "${GITHUB_REF_NAME}"
          python -m pip install --upgrade pip build
          python -m build
          git archive --format=tar.gz --prefix="EvoZeus-infra-${GITHUB_REF_NAME}/" -o "evozeus-infra-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_REF_NAME}"
          shasum -a 256 "evozeus-infra-${GITHUB_REF_NAME}.tar.gz" > "evozeus-infra-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "evozeus-infra-${GITHUB_REF_NAME}.tar.gz" "evozeus-infra-${GITHUB_REF_NAME}.tar.gz.sha256" dist/* --clobber
