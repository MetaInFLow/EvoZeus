name: Product release assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RELEASE_NOTES_DIR: docs/releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release notes
        run: test -s "${RELEASE_NOTES_DIR}/${GITHUB_REF_NAME}.md"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: python -m pip install -e "packs/session-signal[nlp]" -e "packages/runtime[dev]"
      - run: npm run test:python
      - name: Build Core archive and Stable product manifest
        run: |
          test "$(git describe --tags --exact-match)" = "${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="EvoZeus-${GITHUB_REF_NAME}/" -o "evozeus-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_REF_NAME}"
          shasum -a 256 "evozeus-${GITHUB_REF_NAME}.tar.gz" > "evozeus-${GITHUB_REF_NAME}.tar.gz.sha256"
          node scripts/build-stable-product-manifest.mjs --input channels/stable-release-input.json --core-archive "evozeus-${GITHUB_REF_NAME}.tar.gz" --core-commit "${GITHUB_SHA}" --output evozeus-product-stable.json
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "EvoZeus ${GITHUB_REF_NAME}" --notes-file "${RELEASE_NOTES_DIR}/${GITHUB_REF_NAME}.md"
          gh release upload "${GITHUB_REF_NAME}" "evozeus-${GITHUB_REF_NAME}.tar.gz" "evozeus-${GITHUB_REF_NAME}.tar.gz.sha256" evozeus-product-stable.json --clobber
